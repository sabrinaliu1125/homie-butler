<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}
button,input,select,textarea{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 100px}.top,.between,.row{display:flex;align-items:center}.top,.between{justify-content:space-between;gap:10px}.row{gap:9px}.brand{font-weight:800}.small{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 6px 22px rgba(60,70,64,.05)}.card h3{margin:0 0 9px}.homie{border-left:5px solid var(--sage)}.priority{border-left:5px solid var(--yellow)}.history{border-left:5px solid #b6a98e}
.btn,.mini,.pill,.mode,.day{border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink)}.btn{border:0;background:var(--sage);color:white;font-weight:700;padding:11px 14px}.btn.secondary{background:var(--sage2);color:#315245}.btn.full{width:100%}.mini{padding:7px 10px}.pill{padding:8px 11px}
.task,.flow{padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child,.flow:last-child{border-bottom:0}.done{background:var(--sage2);border-radius:14px;padding-left:10px;padding-right:10px}.done .name:before{content:"✓ ";font-weight:900;color:#315245}
.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2eee7;font-size:12px;color:#68716b}.locked{background:#f5ead2}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fffdfaf5;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:10}.tab{border:0;background:none;color:var(--muted);padding:8px;border-radius:13px}.tab.active{background:var(--sage2);color:#315245;font-weight:700}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric>div{background:#f4f0e9;border-radius:13px;padding:10px;text-align:center}.metric b{font-size:19px;display:block}
.month-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:62px;padding:6px 3px;text-align:center;font-size:12px}.day.active{background:var(--sage2);border-color:var(--sage)}.day.muted{opacity:.35}.day .num{font-size:14px;font-weight:700}.day .modeTxt{font-size:10px;margin-top:4px}
.bar{height:10px;background:#ece7df;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--sage)}dialog{border:0;border-radius:20px;padding:0;width:calc(100% - 28px);max-width:460px}dialog::backdrop{background:#0005}.db{padding:18px}.statusgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.status{padding:11px 4px;border:1px solid var(--line);border-radius:14px;background:white}.status.active{background:var(--sage2);border-color:var(--sage)}
.today-shortcut{position:fixed;right:16px;bottom:92px;z-index:9;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 13px;box-shadow:0 5px 18px rgba(60,70,64,.12);font-weight:700;color:#315245}.search-results{max-height:240px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:white}.search-item{width:100%;border:0;border-bottom:1px solid var(--line);background:white;padding:11px;text-align:left}.search-item:last-child{border-bottom:0}

.manage-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.schedule-row{position:relative}
.danger{color:#8b4e46;border-color:#dbc5c1;background:#fff9f7}
.capacity{display:flex;align-items:center;gap:8px}.capacity input{width:88px}
.weekgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bilingual .zh{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.translation-pending{background:#f6f1e6;border-radius:12px;padding:9px;margin-top:7px;font-size:12px;color:#7a6743}

.status-due{color:#a97812!important;font-weight:700}
.status-overdue{color:#b4493d!important;font-weight:800}
.member-badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef3ef;color:#476457;font-size:12px;margin-left:6px}
.action-row{display:flex;gap:6px;flex-wrap:wrap}

.syncbar{margin-top:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

<body>
<div class="app"><div class="top"><div><div class="brand">Homie Butler</div><div class="small">v1.0 Beta · 雲端同步</div><div class="syncbar"><span id="syncDot" class="syncdot"></span><span id="syncText">準備連線</span></div></div><select id="role" class="pill" style="width:auto"></select></div><main id="view"></main></div>

<dialog id="hadddlg"><div class="db">
<div class="between"><h3>Tambah pekerjaan｜自己加工作</h3><button class="mini" onclick="hadddlg.close()">Tutup｜關閉</button></div>
<div class="small">Pilih pekerjaan yang ingin dikerjakan lebih hari ini.｜從既有家事庫選擇今天想多做的工作。</div>

</div></dialog>

<div id="scheduleMatches" class="search-results"></div>
</div></dialog>
<dialog id="pdlg"><div class="db"><div class="between"><h3>加入今天優先</h3><button class="mini" onclick="pdlg.close()">關閉</button></div><div class="small">輸入關鍵字後，從已設定的家事中選擇。</div><div style="height:8px"></div><input id="pin" placeholder="搜尋家事，例如：客廳、排水孔" oninput="renderPriorityMatches()"><div id="priorityMatches" class="search-results"></div><div style="height:8px"></div><button class="btn secondary full" onclick="prepareNewTaskFromPriority()">找不到？新增到家事庫</button></div></dialog>
<script>
const ID={'洗衣服':'Mencuci pakaian','晾衣服':'Menjemur pakaian','收衣服':'Merapikan pakaian','收垃圾':'Mengumpulkan sampah','清貓砂':'Membersihkan kotak pasir kucing','倒除濕機水':'Mengosongkan air dehumidifier','洗貓碗':'Mencuci mangkuk kucing','洗奶瓶與擠乳器':'Mencuci botol dan pompa ASI','餐後收拾':'Merapikan setelah makan','主臥完整清潔':'Membersihkan kamar tidur utama','妹妹房完整清潔':'Membersihkan kamar anak perempuan','弟弟房完整清潔':'Membersihkan kamar anak laki-laki','客廳完整清潔':'Membersihkan ruang tamu','餐廳完整清潔':'Membersihkan ruang makan','廚房完整清潔':'Membersihkan dapur','後陽台完整清潔':'Membersihkan balkon belakang','客廳廁所完整清潔':'Membersihkan toilet ruang tamu','工作室完整清潔':'Membersihkan ruang kerja','排水孔清理':'Membersihkan saluran pembuangan','洗衣機清潔':'Membersihkan mesin cuci','溫奶':'Menghangatkan ASI','早餐／喝奶':'Sarapan / minum susu','送孩子上學':'Mengantar anak ke sekolah','接孩子':'Menjemput anak','晚餐':'Makan malam','睡前奶':'Susu sebelum tidur','很好':'Baik sekali','正常':'Baik','有點累':'Agak lelah','不舒服':'Kurang sehat','家庭日':'Hari keluarga','家事日':'Hari pekerjaan rumah','婆婆家':'Rumah ibu mertua','照護日':'Hari perawatan','外傭休假':'Hari libur','新流程':'Alur baru','新維持工作':'Rutinitas baru','新家事':'Pekerjaan baru'};
const defaults={role:'manager',tab:'today',selected:localYmd(new Date()),modeDefault:'家事日',dateModes:{},weekdayModes:{0:'家庭日',1:'婆婆家',2:'家事日',3:'家事日',4:'婆婆家',5:'家事日',6:'家庭日'},dateCapacity:{},manualAdd:{},manualRemove:{},planned:{},health:'正常',members:[{name:'蓉',role:'管理者'},{name:'外傭',role:'家庭助手'},{name:'先生',role:'家庭觀察者'},{name:'媽媽',role:'家庭觀察者'}],currentMember:'蓉',notes:{},priorities:{},done:{},history:[],flow:[{time:'07:15',name:'溫奶',who:'外傭'},{time:'07:30',name:'早餐／喝奶',who:'全家'},{time:'08:10',name:'送孩子上學',who:'爸爸＋外傭'},{time:'15:50',name:'接孩子',who:'媽媽＋外傭'},{time:'18:00',name:'晚餐',who:'全家'},{time:'19:40',name:'睡前奶',who:'爸爸'}],
tasks:[
{name:'主臥完整清潔',type:'彈性家事',minDays:7,maxDays:14,minutes:90,lastDone:null},
{name:'妹妹房完整清潔',type:'彈性家事',minDays:7,maxDays:14,minutes:75,lastDone:null},
{name:'弟弟房完整清潔',type:'彈性家事',minDays:7,maxDays:14,minutes:75,lastDone:null},
{name:'客廳完整清潔',type:'彈性家事',minDays:5,maxDays:10,minutes:60,lastDone:null},
{name:'餐廳完整清潔',type:'彈性家事',minDays:5,maxDays:10,minutes:45,lastDone:null},
{name:'廚房完整清潔',type:'彈性家事',minDays:5,maxDays:10,minutes:75,lastDone:null},
{name:'後陽台完整清潔',type:'彈性家事',minDays:10,maxDays:21,minutes:60,lastDone:null},
{name:'客廳廁所完整清潔',type:'彈性家事',minDays:7,maxDays:14,minutes:45,lastDone:null},
{name:'工作室完整清潔',type:'彈性家事',minDays:10,maxDays:21,minutes:60,lastDone:null},
{name:'排水孔清理',type:'彈性家事',minDays:30,maxDays:60,minutes:30,lastDone:null},
{name:'洗衣機清潔',type:'彈性家事',minDays:30,maxDays:45,minutes:30,lastDone:null}],
routine:[
{name:'洗衣服',minutes:20},{name:'晾衣服',minutes:20},{name:'收衣服',minutes:20},{name:'收垃圾',minutes:10},{name:'清貓砂',minutes:10},{name:'倒除濕機水',minutes:10},{name:'洗貓碗',minutes:10,preferred:'傍晚'},{name:'餐後收拾',minutes:25},{name:'洗奶瓶與擠乳器',minutes:20}]
};
let S=JSON.parse(localStorage.getItem('homie12')||localStorage.getItem('homie113')||localStorage.getItem('homie112')||localStorage.getItem('homie111')||localStorage.getItem('homie11')||localStorage.getItem('homie10')||localStorage.getItem('homie09')||localStorage.getItem('homie07')||'null')||defaults;
if(!S.routine && S.evening) S.routine=S.evening;
if(!S.routine) S.routine=JSON.parse(JSON.stringify(defaults.routine));
if(!S.flow) S.flow=JSON.parse(JSON.stringify(defaults.flow));
if(!S.tasks) S.tasks=JSON.parse(JSON.stringify(defaults.tasks));
if(!S.currentMember) S.currentMember=(S.members&&S.members[0]?S.members[0].name:'蓉');
if(!S.weekdayModes) S.weekdayModes=JSON.parse(JSON.stringify(defaults.weekdayModes));
if(!S.dateCapacity) S.dateCapacity={};
if(!S.manualAdd) S.manualAdd={};
if(!S.manualRemove) S.manualRemove={};
if(!S.planned) S.planned={};

const V=document.getElementById('view'),R=document.getElementById('role'),pdlg=document.getElementById('pdlg'),sdlg=document.getElementById('sdlg'),hadddlg=document.getElementById('hadddlg');syncRoleSelect();
function localYmd(x){
 const y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),d=String(x.getDate()).padStart(2,'0');
 return `${y}-${m}-${d}`;
}
const today=()=>localYmd(new Date());
function d(s){let [y,m,x]=s.split('-').map(Number);return new Date(y,m-1,x)}
function ds(x){return localYmd(x)}
let cloudReady=false, cloudBusy=false, cloudTimer=null;

function setSyncStatus(kind,text){
 const dot=document.getElementById('syncDot');
 const txt=document.getElementById('syncText');
 if(dot)dot.className='syncdot'+(kind?' '+kind:'');
 if(txt)txt.textContent=text;
}

function getFamilyPin(){
 let pin=localStorage.getItem('homie_family_pin')||'';
 if(!/^\d{6}$/.test(pin)){
   pin=(prompt('請輸入 Homie 家庭 6 位數 PIN')||'').trim();
   if(/^\d{6}$/.test(pin)) localStorage.setItem('homie_family_pin',pin);
 }
 return pin;
}

async function apiRequest(method, payload){
 const pin=getFamilyPin();
 if(!pin) throw new Error('需要家庭 PIN');
 const options={
   method,
   headers:{'Content-Type':'application/json','x-homie-pin':pin}
 };
 if(payload!==undefined) options.body=JSON.stringify(payload);
 const res=await fetch('/api/state',options);
 if(res.status===401){
   localStorage.removeItem('homie_family_pin');
   throw new Error('家庭 PIN 不正確');
 }
 if(!res.ok) throw new Error('雲端錯誤 '+res.status);
 return res.json();
}

function save(){
 localStorage.setItem('homie12',JSON.stringify(S));
 if(cloudReady){
   clearTimeout(cloudTimer);
   cloudTimer=setTimeout(pushCloudState,450);
 }
}

async function pushCloudState(){
 if(cloudBusy || !cloudReady) return;
 try{
   cloudBusy=true;
   setSyncStatus('busy','同步中…');
   await apiRequest('POST',S);
   setSyncStatus('ok','已同步');
 }catch(e){
   console.error(e);
   setSyncStatus('err','同步失敗');
 }finally{
   cloudBusy=false;
 }
}

async function initCloud(){
 try{
   setSyncStatus('busy','連接雲端…');
   const result=await apiRequest('GET');

   if(result && result.data){
     S=result.data;
     localStorage.setItem('homie12',JSON.stringify(S));
     cloudReady=true;
     setSyncStatus('ok','雲端已同步');
     render();
   }else{
     // First device seeds current local state to cloud.
     cloudReady=true;
     await pushCloudState();
     setSyncStatus('ok','已建立家庭雲端資料');
   }
 }catch(e){
   console.error(e);
   cloudReady=false;
   setSyncStatus('err','目前使用本機資料');
 }
}
function currentMemberObj(){
 return (S.members||[]).find(m=>m.name===S.currentMember) || (S.members||[])[0] || {name:'使用者',role:'家庭觀察者'};
}
function currentName(){return currentMemberObj().name}
function currentRole(){return currentMemberObj().role}
function syncRoleSelect(){
 if(!R)return;
 R.innerHTML=(S.members||[]).map(m=>`<option value="${m.name}" ${m.name===S.currentMember?'selected':''}>${m.name} · ${m.role}</option>`).join('');
}
function isManager(){return currentRole()==='管理者'}
function isHelper(){return currentRole()==='家庭助手'}
function isObserver(){return currentRole()==='家庭觀察者'}
function mode(date=S.selected){
 if(S.dateModes[date]) return S.dateModes[date];
 return S.weekdayModes[d(date).getDay()] || S.modeDefault;
}
function capacityMinutes(date=S.selected){return S.dateCapacity[date]===undefined?240:Number(S.dateCapacity[date])}
function setCapacityHours(h){S.dateCapacity[S.selected]=Math.max(0,Number(h)||0)*60;invalidatePlan();render()}
function manualAdded(date=S.selected){return S.manualAdd[date]||[]}
function priorityNames(date=S.selected){return (S.priorities[date]||[]).map(p=>typeof p==='string'?p:p.name)}
function manualRemoved(date=S.selected){return S.manualRemove[date]||[]}function emo(m){return {'家事日':'🧹','家庭日':'👨‍👩‍👧','婆婆家':'👵','照護日':'👶','外傭休假':'🌴'}[m]||'🏡'}function card(t,b,c=''){return `<section class="card ${c}"><h3>${t}</h3>${b}</section>`}function tr(x){return ID[x]||x}
function recurrenceStatus(t,date=today()){
 const n=daysSince(t.lastDone,date);
 if(!t.lastDone)return {cls:'status-overdue',label:'尚無完成紀錄'};
 if(n>t.maxDays)return {cls:'status-overdue',label:`超時 ${n-t.maxDays} 天`};
 if(n>=t.minDays)return {cls:'status-due',label:'已到可安排時間'};
 return {cls:'',label:'尚未到期'};
}
function daysSince(last,date){if(!last)return 999;return Math.floor((d(date)-d(last))/86400000)}function completed(date,name){return !!(S.done[date]||{})[name]}
function duePool(date){
 let priRaw=priorityNames(date);
 let pri=priRaw.map(p=>typeof p==='string'?p:p.name);
 let added=manualAdded(date);
 let removed=new Set(manualRemoved(date));
 let list=S.tasks.filter(t=>{
   if(removed.has(t.name)) return false;
   if(completed(date,t.name)) return true;
   if(pri.includes(t.name) || added.includes(t.name)) return true;
   if(mode(date)!=='家事日') return false;
   return daysSince(t.lastDone,date)>=t.minDays;
 });
 list.sort((a,b)=>{
   let ap=pri.includes(a.name)||added.includes(a.name),bp=pri.includes(b.name)||added.includes(b.name);
   if(ap!==bp)return bp-ap;
   let ar=daysSince(a.lastDone,date)/Math.max(1,a.maxDays),br=daysSince(b.lastDone,date)/Math.max(1,b.maxDays);
   return br-ar;
 });
 return list;
}
function buildPlan(date){
 let pool=duePool(date),budget=capacityMinutes(date),out=[],used=0;
 let forced=new Set([...priorityNames(date),...manualAdded(date)]);
 for(const t of pool){
   if(forced.has(t.name)){out.push(t.name);used+=t.minutes||0;continue}
   if(used+(t.minutes||0)<=budget){out.push(t.name);used+=t.minutes||0}
 }
 S.planned[date]=out;
 return out;
}
function candidates(date){
 let names=S.planned[date];
 if(!Array.isArray(names)) names=buildPlan(date);
 let removed=new Set(manualRemoved(date));
 return names.map(n=>S.tasks.find(t=>t.name===n)).filter(t=>t&&!removed.has(t.name));
}
function invalidatePlan(date=S.selected){delete S.planned[date]}
function extraSuggestions(date){
 if(mode(date)!=='家事日')return [];
 let scheduled=new Set(candidates(date).map(t=>t.name));
 let used=candidates(date).reduce((s,t)=>s+(t.minutes||0),0);
 let remaining=Math.max(0,capacityMinutes(date)-used);
 return S.tasks.filter(t=>!scheduled.has(t.name) && !completed(date,t.name))
   .filter(t=>daysSince(t.lastDone,date)>=Math.max(1,Math.floor(t.minDays*0.7)))
   .sort((a,b)=>daysSince(b.lastDone,date)-daysSince(a.lastDone,date))
   .filter(t=>(t.minutes||0)<=remaining)
   .slice(0,2);
}
function workload(date){let a=candidates(date),m=a.reduce((s,t)=>s+t.minutes,0),cap=capacityMinutes(date);return {items:a,mins:m,left:Math.max(0,cap-m),cap}}
function noteBlock(date,can=true){
 let rows=(S.notes[date]||[]).map(n=>{
   if(isHelper()){
     if(n.lang==='zh') return `<div class="task bilingual"><b>${n.by}</b><div>${n.translationId||'Terjemahan otomatis akan tersedia setelah layanan AI terhubung.'}</div><span class="zh">${n.text}</span>${!n.translationId?'<div class="translation-pending">AI 翻譯尚未連線｜Terjemahan AI belum terhubung</div>':''}</div>`;
     return `<div class="task bilingual"><b>${n.by}</b><div>${n.text}</div><span class="zh">${n.translationZh||'中文自動翻譯待 AI 連線'}</span></div>`;
   }
   if(n.lang==='id'){
     return `<div class="task bilingual"><b>${n.by}</b><div>${n.translationZh||'中文自動翻譯待 AI 連線'}</div><span class="zh">印尼文原文：${n.text}</span>${!n.translationZh?'<div class="translation-pending">接上 AI 後會自動翻成中文</div>':''}</div>`;
   }
   return `<div class="task"><b>${n.by}</b><div>${n.text}</div>${n.translationId?`<div class="small">印尼文：${n.translationId}</div>`:''}</div>`;
 }).join('')|| (isHelper()?'<div class="small">Tidak ada catatan khusus.｜沒有特別備註。</div>':'<div class="small">沒有特別備註。</div>');
 let input='';
 if(can){
   input=isHelper()

function renderPriorityMatches(){const box=document.getElementById('priorityMatches'),input=document.getElementById('pin');if(!box||!input)return;const q=input.value.trim().toLowerCase();let matches=S.tasks.filter(t=>!q||t.name.toLowerCase().includes(q)).slice(0,8);box.innerHTML=matches.length?matches.map(t=>`<button class="search-item" onclick="selectPriorityTask('${t.name.replace(/'/g,"\'")}')"><b>${t.name}</b><div class="small">${t.lastDone?'上次 '+t.lastDone:'尚無完成紀錄'} · ${t.minDays}～${t.maxDays} 天 · 約 ${t.minutes} 分</div></button>`).join(''):'<div class="small" style="padding:12px">找不到相符家事。</div>'}
function selectPriorityTask(name){
 (S.priorities[S.selected]??=[]);
 let names=priorityNames(S.selected);
 if(!names.includes(name))S.priorities[S.selected].push({name,by:currentName()});
 (S.manualAdd[S.selected]??=[]);
 if(!S.manualAdd[S.selected].includes(name))S.manualAdd[S.selected].push(name);
 invalidatePlan();
 S.manualRemove[S.selected]=(S.manualRemove[S.selected]||[]).filter(x=>x!==name);
 pdlg.close();render();
}
function prepareNewTaskFromPriority(){const q=(document.getElementById('pin')?.value||'').trim();S.tab='family';S.pendingNewTaskName=q||'新家事';pdlg.close();render();setTimeout(()=>{const el=document.getElementById('newTaskName');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus();}},50)}
function addPriority(){const q=(document.getElementById('pin')?.value||'').trim();const match=S.tasks.find(t=>t.name===q)||S.tasks.find(t=>t.name.includes(q));if(match)selectPriorityTask(match.name)}
function removePriority(n){
 S.priorities[S.selected]=(S.priorities[S.selected]||[]).filter(p=>(typeof p==='string'?p:p.name)!==n);
 S.manualAdd[S.selected]=(S.manualAdd[S.selected]||[]).filter(x=>x!==n);
 invalidatePlan();render();
}
function toggleDone(name,even=false){S.done[S.selected]??={};let nv=!S.done[S.selected][name];S.done[S.selected][name]=nv;if(nv){S.history.push({date:S.selected,name,by:currentName()});if(!even){let t=S.tasks.find(x=>x.name===name);if(t)t.lastDone=S.selected}}else{S.history=S.history.filter(x=>!(x.date===S.selected&&x.name===name));if(!even){let t=S.tasks.find(x=>x.name===name);if(t&&t.lastDone===S.selected){let prev=S.history.filter(x=>x.name===name).map(x=>x.date).sort().pop();t.lastDone=prev||null}}}render()}
function shiftMonth(n){let x=d(S.selected);x.setMonth(x.getMonth()+n);x.setDate(1);S.selected=ds(x);render()}
